    .card {

      border-radius: 20px;
      padding: 22px;

/* ===== MODERN WEEKLY CALENDAR ===== */

.week-calendar {
  background: white;
  border-radius: 18px;
  padding: 24px;
  margin: 24px 0;
  border: 1px solid #e8edf5;
  box-shadow: 0 5px 20px rgba(20, 40, 80, 0.06);
}

.week-calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.week-calendar-header h3 {
  margin: 0;
  font-size: 20px;
  color: #172b4d;
}

.week-calendar-header button {
  width: 42px;
  height: 42px;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  background: #f4f7fb;
  color: #172b4d;
  font-size: 22px;
  cursor: pointer;
}

.week-calendar-header button:hover {
  background: #e7f0ff;
}

.calendar-days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 12px;
}

.calendar-day {
  min-width: 0;
  min-height: 82px;
  border: 1px solid #e5eaf2;
  border-radius: 14px;
  background: #f8faff;
  color: #172b4d;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  font-family: inherit;
}

.calendar-day:hover {
  background: #eaf3ff;
  border-color: #087bea;
}

.calendar-day.selected {
  background: #087bea;
  color: white;
  border-color: #087bea;
}

.calendar-day .day-name {
  font-size: 13px;
  font-weight: 500;
}

.calendar-day .day-number {
  font-size: 22px;
  font-weight: 700;
}

@media (max-width: 600px) {
  .week-calendar {
    padding: 14px;
  }

  .calendar-days {
    gap: 5px;
  }

  .calendar-day {
    min-height: 65px;
    border-radius: 10px;
  }

  .calendar-day .day-number {
    font-size: 17px;
  }

  .calendar-day .day-name {
    font-size: 11px;
  }
}

.diary-header-actions {

.weight-nav-button {

/* ===== MODERN MEAL CARDS ===== */

#meals .card {
  background: #ffffff;
  border: 1px solid #e8edf5;
  border-radius: 18px;
  padding: 26px;
  margin-top: 20px;

}

/* Meal heading */
#meals .meal-heading {
  display: flex;
  justify-content: space-between;

  border-bottom: 1px solid #edf1f7;
}

}

/* Individual food entries */
#meals .food-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  padding: 16px 0;
  border-bottom: 1px solid #f0f3f8;
}

#meals .food-row:last-child {
  border-bottom: none;
}

/* Mobile-friendly layout */
@media (max-width: 600px) {
  #meals .card {
    padding: 18px;
  }

  #meals .food-row {
    flex-wrap: wrap;
    gap: 12px;
  }
}
/* ===== MODERN EDIT & DELETE BUTTONS ===== */

#meals .edit-button,
#meals .delete-button {
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s ease;
}

/* Edit button */
#meals .edit-button {
  background: #eef5ff;
  color: #087bea;
  border: 1px solid #c9dfff;
}

#meals .edit-button:hover {
  background: #087bea;
  color: white;
  border-color: #087bea;
  transform: translateY(-2px);
}

/* Delete button */
#meals .delete-button {
  background: #fff1f1;
  color: #dc2626;
  border: 1px solid #fecaca;
}

#meals .delete-button:hover {
  background: #dc2626;
  color: white;
  border-color: #dc2626;
  transform: translateY(-2px);
}

/* Keyboard accessibility */
#meals .edit-button:focus-visible,
#meals .delete-button:focus-visible {
  outline: 3px solid #93c5fd;
  outline-offset: 2px;
}

/* Disabled buttons */
#meals .edit-button:disabled,
#meals .delete-button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}
/* ===== MODERN DAILY NUTRITION SUMMARY ===== */

#summary {
  background: #ffffff;
  border: 1px solid #e8edf5;
  border-radius: 22px;
  padding: 32px;
  box-shadow: 0 6px 24px rgba(20, 40, 80, 0.06);
}

#summary h2 {
  font-size: 23px;
  font-weight: 700;
  color: #172b4d;
  margin-bottom: 20px;
}

/* Calories consumed */
#summary .calorie-progress {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}

#summary .calories {
  font-size: 48px;
  font-weight: 800;
  line-height: 1.1;
  color: #087bea;
}

#summary .goal-text {
  font-size: 17px;
  font-weight: 500;
  color: #667085;
}

#remainingCalories {
  margin-top: 8px;
  font-size: 15px;
}

/* Calorie progress bar */
#summary .progress-container {
  width: 100%;
  height: 14px;
  background: #eaf0f8;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 22px;
}

#summary .progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #087bea, #38bdf8);
  border-radius: 20px;
  transition: width 0.3s ease;
}

#summary .progress-text {
  text-align: right;
  margin-top: 8px;
  font-size: 13px;
  color: #667085;
}

/* Daily calorie goal */
#summary .goal-setting {
  margin-top: 26px;
}

#summary .goal-setting label {
  display: block;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 10px;
  color: #172b4d;
}

#summary .goal-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

#summary #calorieGoal {
  width: 160px;
  height: 48px;
  padding: 12px;
  border: 1px solid #d9e2ef;
  border-radius: 12px;
  font-size: 16px;
}

#summary #updateGoalButton {
  min-height: 48px;
  padding: 12px 20px;
  border: none;
  border-radius: 12px;
  background: #087bea;
  color: white;
  font-weight: 600;
  cursor: pointer;
}

/* Nutrient cards */
#summary .nutrients {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-top: 28px;
}

#summary .nutrients > * {
  background: #f4f7fc;
  border: 1px solid #e8edf5;
  border-radius: 14px;
  padding: 20px 12px;
  text-align: center;
}

/* Mobile responsive */
@media (max-width: 600px) {
  #summary {
    padding: 20px;
  }

  #summary .calories {
    font-size: 38px;
  }

  #summary .nutrients {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
}

<div id="progressText" class="progress-text">0%</div>
<div class="goal-setting">
  <label for="calorieGoal">Daily calorie goal</label>

  <div class="goal-row">
    <input
      id="calorieGoal"
      type="number"
      min="500"
      max="10000"
      step="50"
      value="2000"
    >

    <button id="updateGoalButton" type="button">
      Update Goal
    </button>
  </div>

  <p id="goalMessage" class="muted"></p>
</div>
    <div id="nutrientTotals" class="nutrients"></div>
    <p id="nutritionNote" class="muted"></p>
  </section>

  <div class="copy-meals-section">
  <button id="copyYesterdayButton" type="button">
    Copy Yesterday's Meals
  </button>

  <p id="copyMealsMessage" class="muted"></p>
</div>

<div id="meals"></div>
  
<div id="editModal" class="edit-modal" hidden>
  <div class="edit-modal-box">

    <h2>Edit Food</h2>

    <p id="editFoodName" class="muted"></p>

    <label for="editQuantity">Quantity (grams)</label>
    <input
      id="editQuantity"
      type="number"
      min="1"
      step="1"
    >

    <label for="editMealType">Meal</label>
    <select id="editMealType">
      <option value="Breakfast">Breakfast</option>
      <option value="Lunch">Lunch</option>
      <option value="Snack">Snack</option>
      <option value="Dinner">Dinner</option>
    </select>

    <div class="edit-modal-actions">
      <button id="cancelEditButton" type="button">
        Cancel
      </button>

      <button id="saveEditButton" type="button">
        Save Changes
      </button>
    </div>

    <p id="editMessage" class="muted"></p>

  </div>
</div> 
</main>

<script>
  const diaryDate = document.getElementById("diaryDate");
  const status = document.getElementById("status");
  const summary = document.getElementById("summary");
  const meals = document.getElementById("meals");
  const editModal = document.getElementById("editModal");
const editFoodName = document.getElementById("editFoodName");
const editQuantity = document.getElementById("editQuantity");
const editMealType = document.getElementById("editMealType");
const cancelEditButton = document.getElementById("cancelEditButton");
const saveEditButton = document.getElementById("saveEditButton");
const editMessage = document.getElementById("editMessage");

let foodBeingEdited = null;
cancelEditButton.addEventListener("click", () => {

  editModal.hidden = true;

  foodBeingEdited = null;

  editMessage.textContent = "";

});
saveEditButton.addEventListener("click", async () => {

  if (!foodBeingEdited) return;

  const food = foodBeingEdited;

  const oldQuantity = String(food.quantity || "").trim();

  if (!/^\d+(\.\d+)?\s*g$/i.test(oldQuantity)) {
    editMessage.textContent =
      "Only food quantities saved in grams can be edited.";
    return;
  }

  const oldGrams = parseFloat(oldQuantity);
  const newGrams = editQuantity.valueAsNumber;
  const newMeal = editMealType.value;

  if (!Number.isFinite(newGrams) || newGrams <= 0) {
    editMessage.textContent =
      "Please enter a valid quantity in grams.";
    return;
  }

  if (!Number.isFinite(oldGrams) || oldGrams <= 0) {
    editMessage.textContent = "Invalid original quantity.";
    return;
  }

  const multiplier = newGrams / oldGrams;

  const scaleNutrient = (value) =>
    isKnown(value) ? value * multiplier : value;

  const updatedFood = {
    foodName: food.foodName,
    mealType: newMeal,
    quantity: newGrams + " g",
    calories: scaleNutrient(food.calories),
    protein: scaleNutrient(food.protein),
    carbs: scaleNutrient(food.carbs),
    fiber: scaleNutrient(food.fiber),
    fat: scaleNutrient(food.fat),
    entryDate: food.entryDate
  };

  saveEditButton.disabled = true;
  saveEditButton.textContent = "Saving...";
  editMessage.textContent = "";

  try {
    const response = await fetch(`/api/foods/${food.id}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(updatedFood)
    });

    if (!response.ok) {
      throw new Error("Could not save changes.");
    }

    editModal.hidden = true;
    foodBeingEdited = null;

    await loadDiary();

  } catch (error) {
    editMessage.textContent = error.message;
  } finally {
    saveEditButton.disabled = false;
    saveEditButton.textContent = "Save Changes";
  }
});
  const calorieGoalInput = document.getElementById("calorieGoal");
const updateGoalButton = document.getElementById("updateGoalButton");
const goalMessage = document.getElementById("goalMessage");

let dailyCalorieGoal =
  Number(localStorage.getItem("dailyCalorieGoal")) || 2000;

calorieGoalInput.value = dailyCalorieGoal;
updateGoalButton.addEventListener("click", function () {

  const newGoal = Number(calorieGoalInput.value);

  if (!Number.isFinite(newGoal) || newGoal < 500 || newGoal > 10000) {
    goalMessage.textContent =
      "Enter a calorie goal between 500 and 10,000.";
    return;
  }

  dailyCalorieGoal = newGoal;

  localStorage.setItem(
    "dailyCalorieGoal",
    String(newGoal)
  );

  goalMessage.textContent =
    "Goal updated to " + newGoal + " kcal.";

  loadDiary();
});

  const today = new Date();
  diaryDate.value = [
    today.getFullYear(),
    String(today.getMonth() + 1).padStart(2, "0"),
    String(today.getDate()).padStart(2, "0")
  ].join("-");

  let latestRequest = 0;

  function isKnown(value) {
    return typeof value === "number" &&
      Number.isFinite(value) && value >= 0;
  }

  function totalFor(entries, field) {
    const known = entries.filter(food => isKnown(food[field]));
    const total = known.reduce((sum, food) => sum + food[field], 0);

    if (entries.length > 0 && known.length === 0) {
      return "Unavailable";
    }

    return total.toFixed(1) +
      (known.length < entries.length ? "*" : "");
  }

  async function loadDiary() {
    const requestNumber = ++latestRequest;
    summary.hidden = true;
    meals.replaceChildren();

    if (!diaryDate.value || !diaryDate.checkValidity()) {
      status.textContent = "Choose a valid date.";
      return;
    }

    const selectedDate = diaryDate.value;
    status.textContent = "Loading your diary…";

    try {
      const response = await fetch("/api/foods", {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("Could not load your food diary.");
      }

      const allFoods = await response.json();

      if (requestNumber !== latestRequest) return;

      if (!Array.isArray(allFoods)) {
        throw new Error("Unexpected food data received.");
      }

      const foods = allFoods.filter(
        food => food.entryDate === selectedDate
      );

      const calorieGoal = dailyCalorieGoal;
      document.getElementById("goalDisplay").textContent =
  calorieGoal;

const knownCalories = foods.filter(food =>
  isKnown(food.calories)
);

const caloriesLogged = knownCalories.reduce(
  (sum, food) => sum + food.calories,
  0
);

document.getElementById("calorieTotal").textContent =
  caloriesLogged.toFixed(1);

  const progressPercent =
  calorieGoal > 0
    ? Math.min((caloriesLogged / calorieGoal) * 100, 100)
    : 0;

document.getElementById("calorieProgressBar").style.width =
  progressPercent + "%";

document.getElementById("progressText").textContent =
  Math.round(progressPercent) + "% of daily goal";

const remaining = calorieGoal - caloriesLogged;

document.getElementById("remainingCalories").textContent =
  remaining >= 0
    ? remaining.toFixed(1) + " kcal remaining"
    : Math.abs(remaining).toFixed(1) + " kcal over your goal";

      const nutrientTotals =
        document.getElementById("nutrientTotals");
      nutrientTotals.replaceChildren();

      const nutrients = [
        ["protein", "Protein"],
        ["carbs", "Carbs"],
        ["fiber", "Fiber"],
        ["fat", "Fat"]
      ];

      for (const [field, label] of nutrients) {
        const tile = document.createElement("div");
        tile.className = "nutrient";

        const amount = document.createElement("strong");
        const name = document.createElement("span");
        const total = totalFor(foods, field);

        amount.textContent =
          total === "Unavailable" ? total : total + " g";
        name.textContent = label;

        tile.append(amount, name);
        nutrientTotals.append(tile);
      }

      const fields = ["calories", "protein", "carbs", "fiber", "fat"];
      const hasMissing = foods.some(food =>
        fields.some(field => !isKnown(food[field]))
      );

      document.getElementById("nutritionNote").textContent =
        hasMissing
          ? "* Partial total: some entries have missing nutrients. Unavailable means no values were recorded."
          : "";

      const mealTypes = ["Breakfast", "Lunch", "Snack", "Dinner"];
      const groups = [...mealTypes, "Other"];

      for (const mealType of groups) {
        const entries = foods.filter(food =>
          mealType === "Other"
            ? !mealTypes.includes(food.mealType)
            : food.mealType === mealType
        );

        if (mealType === "Other" && entries.length === 0) continue;

        const card = document.createElement("section");
        card.className = "card";

        const heading = document.createElement("div");
        heading.className = "meal-heading";

        const title = document.createElement("h2");
        title.textContent = mealType;

        const total = document.createElement("span");
        total.className = "food-calories";
        const mealTotal = totalFor(entries, "calories");
        total.textContent = mealTotal === "Unavailable"
          ? mealTotal
          : mealTotal + " kcal";

        heading.append(title, total);
        card.append(heading);

        if (entries.length === 0) {
          const empty = document.createElement("p");
          empty.className = "muted";
          empty.textContent = "No food logged yet.";
          card.append(empty);
        }

        for (const food of entries) {
          const row = document.createElement("div");
          row.className = "food-row";

          const details = document.createElement("div");
          details.className = "food-name";

          const name = document.createElement("strong");
          name.textContent = food.foodName;

          const quantity = document.createElement("small");
          quantity.textContent = food.quantity || "";

          const calories = document.createElement("span");
calories.className = "food-calories";
calories.textContent = isKnown(food.calories)
  ? food.calories.toFixed(1) + " kcal"
  : "Unavailable";

  const editButton = document.createElement("button");
editButton.type = "button";
editButton.textContent = "Edit";
editButton.className = "edit-button";

editButton.addEventListener("click", () => {

  const grams = parseFloat(food.quantity);

  if (!Number.isFinite(grams) || grams <= 0) {
    alert("This food cannot be edited by grams.");
    return;
  }

  foodBeingEdited = food;

  editFoodName.textContent = food.foodName;
  editQuantity.value = grams;
  editMealType.value = food.mealType || "Breakfast";
  editMessage.textContent = "";

  editModal.hidden = false;
});

const deleteButton = document.createElement("button");
deleteButton.type = "button";
deleteButton.textContent = "Delete";
deleteButton.className = "delete-button";

deleteButton.addEventListener("click", async () => {

  const confirmed = confirm(
    `Delete ${food.foodName} from your diary?`
  );

  if (!confirmed) {
    return;
  }

  deleteButton.disabled = true;
  deleteButton.textContent = "Deleting...";

  try {
    const response = await fetch(`/api/foods/${food.id}`, {
      method: "DELETE"
    });

    if (!response.ok) {
      throw new Error("Could not delete this food.");
    }

    await loadDiary();

  } catch (error) {
    status.textContent = error.message;
    deleteButton.disabled = false;
    deleteButton.textContent = "Delete";
  }
});

details.append(name, quantity);

const actions = document.createElement("div");
actions.className = "food-actions";
actions.append(calories, editButton, deleteButton);

row.append(details, actions);
card.append(row);
        }

        meals.append(card);
      }

      summary.hidden = false;
      status.textContent = foods.length === 0
        ? "No entries for this date. Use Add food to get started."
        : "";
    } catch (error) {
      if (requestNumber !== latestRequest) return;
      status.textContent = error.message;
    }
  }

  diaryDate.addEventListener("change", loadDiary);
  loadDiary();

  // Copy yesterday's meals into the selected diary date
document.getElementById("copyYesterdayButton")
  .addEventListener("click", async () => {

    const selectedDate = diaryDate.value;
    const message = document.getElementById("copyMealsMessage");
    const button = document.getElementById("copyYesterdayButton");

    if (!selectedDate) {
      message.textContent = "Please select a date first.";
      return;
    }

    const yesterday = new Date(selectedDate + "T12:00:00");
    yesterday.setDate(yesterday.getDate() - 1);

    const yesterdayDate = [
      yesterday.getFullYear(),
      String(yesterday.getMonth() + 1).padStart(2, "0"),
      String(yesterday.getDate()).padStart(2, "0")
    ].join("-");

    button.disabled = true;
    message.textContent = "Copying meals...";

    try {
      const response = await fetch("/api/foods", {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("Could not load food entries.");
      }

      const allFoods = await response.json();

      const yesterdayFoods = allFoods.filter(
        food => food.entryDate === yesterdayDate
      );

      if (yesterdayFoods.length === 0) {
        message.textContent = "No meals found for the previous day.";
        return;
      }

      const confirmed = confirm(
        `Copy ${yesterdayFoods.length} food entries from ${yesterdayDate} to ${selectedDate}?`
      );

      if (!confirmed) {
        message.textContent = "Copy cancelled.";
        return;
      }

      let copied = 0;

      for (const food of yesterdayFoods) {
        const newFood = {
          foodName: food.foodName,
          quantity: food.quantity,
          mealType: food.mealType,
          entryDate: selectedDate,
          calories: food.calories,
          protein: food.protein,
          carbs: food.carbs,
          fiber: food.fiber,
          fat: food.fat
        };

        const saveResponse = await fetch("/api/foods", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(newFood)
        });

        if (!saveResponse.ok) {
          throw new Error(`Copied ${copied} entries before an error. Check your diary before retrying.`);
        }

        copied++;
      }

      await loadDiary();

      message.textContent =
        `${copied} food entries copied successfully!`;

    } catch (error) {
      message.textContent = error.message;
    } finally {
      button.disabled = false;
    }

  });
  // ===== WEEKLY CALENDAR =====

const calendarDays = document.getElementById("calendarDays");
const calendarMonth = document.getElementById("calendarMonth");
const previousWeek = document.getElementById("previousWeek");
const nextWeek = document.getElementById("nextWeek");

// Convert YYYY-MM-DD into a local date
function parseCalendarDate(value) {
  const [year, month, day] = value.split("-").map(Number);
  return new Date(year, month - 1, day);
}

// Convert local date back to YYYY-MM-DD
function formatCalendarDate(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

function renderWeekCalendar() {
  if (!diaryDate.value) return;

  const selectedDate = parseCalendarDate(diaryDate.value);

  const monday = new Date(selectedDate);
  const dayOfWeek = (monday.getDay() + 6) % 7;

  monday.setDate(monday.getDate() - dayOfWeek);

  calendarMonth.textContent = selectedDate.toLocaleDateString("en-US", {
    month: "long",
    year: "numeric"
  });

  calendarDays.replaceChildren();

  for (let i = 0; i < 7; i++) {
    const date = new Date(monday);
    date.setDate(monday.getDate() + i);

    const dateValue = formatCalendarDate(date);

    const button = document.createElement("button");
    button.type = "button";
    button.className = "calendar-day";

    if (dateValue === diaryDate.value) {
      button.classList.add("selected");
    }

    const dayName = document.createElement("span");
    dayName.className = "day-name";
    dayName.textContent = date.toLocaleDateString("en-US", {
      weekday: "short"
    });

    const dayNumber = document.createElement("span");
    dayNumber.className = "day-number";
    dayNumber.textContent = date.getDate();

    button.append(dayName, dayNumber);

    button.addEventListener("click", () => {
      diaryDate.value = dateValue;
      diaryDate.dispatchEvent(new Event("change", { bubbles: true }));
      renderWeekCalendar();
    });

    calendarDays.appendChild(button);
  }
}

function changeCalendarWeek(days) {
  if (!diaryDate.value) return;

  const date = parseCalendarDate(diaryDate.value);
  date.setDate(date.getDate() + days);

  diaryDate.value = formatCalendarDate(date);
  diaryDate.dispatchEvent(new Event("change", { bubbles: true }));
  renderWeekCalendar();
}

previousWeek.addEventListener("click", () => {
  changeCalendarWeek(-7);
});

nextWeek.addEventListener("click", () => {
  changeCalendarWeek(7);
});

diaryDate.addEventListener("change", renderWeekCalendar);

renderWeekCalendar();
</script>
